plugins {
    id 'java'
    id 'jacoco'
    id 'application'
}

group = 'ru.nsu.nmedvedeva1.Task_1_4_1'
version = '1.0-SNAPSHOT'

repositories {
    mavenCentral()
}

dependencies {
    testImplementation platform('org.junit:junit-bom:6.0.0')
    testImplementation 'org.junit.jupiter:junit-jupiter'
    testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

application {
    mainClass = 'ru.nsu.nmedvedeva1.book.Main'
}

test {
    useJUnitPlatform()
    maxHeapSize = '64m'
}

run {
    standardInput = System.in
}

jacocoTestReport {
    reports {
        xml.required = true
    }
}